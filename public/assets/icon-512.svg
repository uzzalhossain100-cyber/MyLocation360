<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Compass Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-dasharray="12 10"/>
  <circle cx="256" cy="256" r="125" fill="#ffffff" fill-opacity="0.12"/>
  
  <!-- Compass Needles -->
  <polygon points="256,90 286,256 256,236 226,256" fill="#ef4444" filter="url(#shadow)"/>
  <polygon points="256,422 286,256 256,276 226,256" fill="#f8fafc" filter="url(#shadow)"/>
  
  <!-- Cardinal labels -->
  <text x="256" y="75" font-family="'Hind Siliguri', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">উ</text>
  <text x="256" y="465" font-family="'Hind Siliguri', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">দ</text>
  <text x="65" y="266" font-family="'Hind Siliguri', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">প</text>
  <text x="447" y="266" font-family="'Hind Siliguri', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">পূ</text>

  <!-- Weather badge overlapping -->
  <g transform="translate(290, 270) scale(0.65)" filter="url(#shadow)">
    <circle cx="100" cy="100" r="75" fill="#fbbf24"/>
    <path d="M120 80 a30 30 0 0 0 -58 10 a22 22 0 0 0 8 43 h70 a25 25 0 0 0 0 -50 a25 25 0 0 0 -20 -3 z" fill="#f1f5f9"/>
  </g>
</svg>
